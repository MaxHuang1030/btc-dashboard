name: update-data
on:
  schedule:
    - cron: "17 1 * * *"   # 每天 09:17 台北時間
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch data
        run: python scripts/fetch.py
      - name: Commit data
        run: |
          git config user.name "btc-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html style.css app.js _site/ && cp -r vendor _site/
          cp -r data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
